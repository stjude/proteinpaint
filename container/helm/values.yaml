nameOverride: ""
fullnameOverride: ""

labels: {}
annotations: {}

image:
  repository: ghcr.io/stjude/ppserver
  tag: "2.215.0-4e121393d"
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: "" # Used for IRSA for the pod to grant access to the bucket with the config files.
  labels: {}

podLabels:
  app: proteinpaint
podAnnotations: {}

resources:
  requests:
    cpu: "2"
    memory: "8Gi"
  limits:
    cpu: "2"
    memory: "8Gi"

# The server needs no capabilities and does not write to the image files, so the root filesystem is read-only;
# it writes only to the data volume (tp/cache) and to the writableDirs below. These are the same settings as
# the container units in the sjpp releaseRollout, see container/runtimePosture.mjs for what each one prevents.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
# The image runs as the unprivileged app user (UID/GID 1000, see container/deps/Dockerfile), and fsGroup makes
# the mounted volumes, such as the tp/cache dir, writable by that user. Another runAsUser may be used with
# runAsGroup: 0, since the dirs that the app writes at runtime are also writable for group 0. An image.tag
# from before the non-root images, whose node install is under /root, needs podSecurityContext: {} instead.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# emptyDir mounts for the dirs that the server, python, and R write to besides the cachedir, since the root
# filesystem is read-only: /tmp, which the image uses as the OS temp dir, and the app user's HOME for the python
# and R caches. A Kubernetes emptyDir or PVC cannot be mounted with noexec, which container/runtimePosture.mjs
# recommends for the writable dirs. As this chart sets PP_MODE to empty, envHelpers.mjs does not run that check
# at startup, and PP_RUNTIME_CHECK has no effect; to see which settings are not applied in a running pod, use
#   kubectl exec <pod> -- node runtimePosture.mjs /home/root/pp/tp/cache
writableDirs:
  - name: tmp
    mountPath: /tmp
    sizeLimit: 2Gi
  - name: app-home
    mountPath: /home/app
    sizeLimit: 256Mi

container:
  name: proteinpaint
  containerPort: 3456
  command: ["/bin/bash"]
  # envHelpers.mjs applies the node permission model to limit the server process file access, passes any
  # <NAME>_CREDS_FILE content as <NAME>_CREDS, and then replaces itself with the server. Images published
  # before envHelpers.mjs was added do not have it, so the server then runs without those restrictions.
  # The serverconfig.json is mounted read-only from the config map, which needs an image from v2.213.0 or
  # later; an older image rewrites serverconfig.json at startup.
  args:
    - "-c"
    - |
      if [ -f envHelpers.mjs ]; then
        exec node envHelpers.mjs node --enable-source-maps app-server.mjs
      fi
      echo "WARNING: this image does not have envHelpers.mjs, running the server without file access restrictions" >&2
      exec node --enable-source-maps app-server.mjs
  # the image defaults to PP_MODE=container-prod, which would override the port and tpmasterdir/cachedir
  # paths below in config.serverConfig, so this chart sets it to empty to use its own values instead;
  # set with ppMode instead of container.env, which the deployment template appends after PP_MODE
  ppMode: ""
  # additional env entries, such as PP_CREDS_FILE
  env: []

mounts:
  data:
    # when disabled, an emptyDir is mounted at config.serverConfig.cachedir instead, since the root filesystem is
    # read-only; its cache data, including saved sessions, is then lost when the pod is replaced
    enabled: true
    name: storage-volume
    mountPath: /home/root/pp/tp/
    pvcName: proteinpaint-pvc
  config:
    name: config-volume
    mountPath: /home/root/pp/app/active/serverconfig.json
    subPath: serverconfig.json
    configMapName: proteinpaint-config

extraVolumeMounts: []
extraVolumes: []

service:
  type: ClusterIP
  annotations: {}
  labels: {}

config:
  name: proteinpaint-config
  serverConfigFilename: serverconfig.json
  serverConfig:
    debugmode: true
    defaultgenome: "hg38"
    genomes:
      - name: "hg19"
        species: "human"
        file: "./genome/hg19.js"
        datasets: []
      - name: "hg38"
        species: "human"
        file: "./genome/hg38.js"
        datasets: []
    tpmasterdir: "/home/root/pp/tp/"
    cachedir: "/home/root/pp/tp/cache"
    URL: "http://localhost:3456"
    gfClient: "/home/root/pp/tools/gfClient"
    port: 3456
    backend_only: true

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

storage:
  bucketName: "" # Name of bucket that holds the config files, requires S3 mountpoint driver to work
  region: "us-east-1"
