apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proteinpaint.fullname" . }}-deployment
  labels:
    {{- include "proteinpaint.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "proteinpaint.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "proteinpaint.selectorLabels" . | nindent 8 }}
        {{- range $k, $v := .Values.podLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      annotations:
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "proteinpaint.serviceAccountName" . }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.container.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.container.command }}
          command:
            {{- toYaml .Values.container.command | nindent 12 }}
          {{- end }}
          {{- if .Values.container.args }}
          args:
            {{- toYaml .Values.container.args | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.container.containerPort }}
          env:
            # rendered separately from container.env, since helm replaces a list in a values override
            # instead of merging it, which would drop this entry when container.env is overridden
            - name: PP_MODE
              value: {{ .Values.container.ppMode | quote }}
            {{- if .Values.cacheIdCreds.enabled }}
            # envHelpers.mjs passes it to the server like the other <NAME>_CREDS values, not in the server's initial env
            - name: PP_CACHEID_CREDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cacheIdCreds.existingSecret | default (printf "%s-cacheid" (include "proteinpaint.fullname" .)) }}
                  key: {{ .Values.cacheIdCreds.secretKey }}
            {{- end }}
            {{- with .Values.container.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: "/healthcheck"
              port: 3456
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
          readinessProbe:
            httpGet:
              path: "/healthcheck"
              port: 3456
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.mounts.data.enabled }}
            - name: {{ .Values.mounts.data.name }}
              mountPath: {{ .Values.mounts.data.mountPath }}
            {{- else }}
            - name: cache
              mountPath: {{ .Values.config.serverConfig.cachedir }}
            {{- end }}
            - name: {{ .Values.mounts.config.name }}
              mountPath: {{ .Values.mounts.config.mountPath }}
              subPath: {{ .Values.mounts.config.subPath }}
              readOnly: true
            {{- range .Values.writableDirs }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- range .Values.extraVolumeMounts }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        {{- if .Values.mounts.data.enabled }}
        - name: {{ .Values.mounts.data.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.mounts.data.pvcName }}
        {{- else }}
        - name: cache
          emptyDir:
            {{- with .Values.mounts.data.cacheSizeLimit }}
            sizeLimit: {{ . }}
            {{- else }} {}
            {{- end }}
        {{- end }}
        {{- range .Values.writableDirs }}
        - name: {{ .name }}
          emptyDir:
            {{- with .sizeLimit }}
            sizeLimit: {{ . }}
            {{- else }} {}
            {{- end }}
        {{- end }}
        - name: {{ .Values.mounts.config.name }}
          configMap:
            name: {{ .Values.mounts.config.configMapName | default .Values.config.name }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
