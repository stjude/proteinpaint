name: "Publish rust binaries"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  rust-build:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/CD-rust-build.yml

  upload-rust-assets:
    environment: release
    needs: rust-build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      # a local action is read from the checked-out workspace
      - uses: actions/checkout@v7

      - name: Upload rust assets
        uses: ./.github/actions/upload-rust-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}