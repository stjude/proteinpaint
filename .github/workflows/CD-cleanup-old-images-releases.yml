name: "Cleanup old images and releases"
#Files are used for images because a single argument/environment-variable string can't exceed ~128KB (MAX_ARG_STRLEN)
#when passed to another process (e.g. via jq --argjson or $GITHUB_ENV). However, we are not using it for releases
#as they do not need files due to it's volume based on today's measured size


on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: Dry run (log what should be deleted, delete nothing)
        default: true

jobs:
  cleanup-images:
    runs-on: ubuntu-22.04
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: 
          token: ${{ secrets.PAT }}

      - name: Read Config
        run: | 
          CONFIG=.github/cleanup-config.json
          echo "MAX_AGE_DAYS=$(jq -r '.maxAgeDays' "$CONFIG")" >> "$GITHUB_ENV"
          echo "MAX_DELETIONS=$(jq -r '.maxImageDeletionsPerRun' "$CONFIG")" >> "$GITHUB_ENV"
          echo "VERSIONS_TO_RETAIN=$(jq -r '.VersionsToRetain' "$CONFIG")" >> "$GITHUB_ENV"
          echo "PACKAGES=$(jq -c '.packages' "$CONFIG")" >> "$GITHUB_ENV"
          echo "INDEX_PACKAGES=$(jq -c '.IndexPackages' "$CONFIG")" >> "$GITHUB_ENV"

      - name: List release branches
        run: |
          BRANCH_PAGES=$(gh api repos/stjude/proteinpaint/branches --paginate)
          RELEASE_BRANCHES=$(printf '%s\n' "$BRANCH_PAGES" | jq -sc '[.[][] | .name | select(startswith("release-"))]')
          echo "RELEASE_BRANCHES=$RELEASE_BRANCHES" >> "$GITHUB_ENV" 
        env:
          GH_TOKEN: ${{secrets.PAT}}
        
      - name: List package versions
        run: |
          IMAGE_VERSIONS_FILE="$RUNNER_TEMP/image_versions.json" #$RUNNER_TEMP is a GitHub Actions built-in env var, a per-job scratch directory that's auto-created and auto-cleaned 
          echo "[]" > "$IMAGE_VERSIONS_FILE" #Create an empty JSON array inside the file

          for pkg in $(echo "$PACKAGES" | jq -r '.[]'); do #For every package, we pull the image versions and save it in a file under RUNNER_TEMP
            if ! gh api "orgs/stjude/packages/container/${pkg}/versions" --paginate \
              --jq '[.[] | {package: "'"$pkg"'", id, created_at, name, tags: .metadata.container.tags}]' > "$RUNNER_TEMP/pkg.raw"; then 
              echo "::warning::package '$pkg' not found or API call failed - skipping"
              continue
            fi
            jq -sc 'add // []' "$RUNNER_TEMP/pkg.raw" > "$RUNNER_TEMP/pkg.json" #the // [] at the end is a fallback for the case where a package has zero versions 
            jq -s -c '.[0] + .[1]' "$IMAGE_VERSIONS_FILE" "$RUNNER_TEMP/pkg.json" > "$RUNNER_TEMP/next.json"
            mv "$RUNNER_TEMP/next.json" "$IMAGE_VERSIONS_FILE"
          done
          echo "IMAGE_VERSIONS_FILE=$IMAGE_VERSIONS_FILE" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{secrets.PAT}}
      
      - name: Restore manifest cache
        # The manifest at a digest never changes, so what was learned about a digest in an earlier run is
        # reused here, and only digests not seen before are fetched. Every run saves a new cache entry
        # (keyed by run id) at the end of the job, and the next run restores the newest one by prefix.
        uses: actions/cache@v6
        with:
          path: .cache/manifest-groups
          key: manifest-groups-${{ github.run_id }}
          restore-keys: manifest-groups-

      - name: Build manifest groups
        # ppclingen, ppfilesync, and proteinpaint%2Fppserver are built via docker/build-push-action with
        # default provenance attestations, so their tagged versions are OCI image INDEXES referencing
        # untagged child manifests (platform image + attestation) by digest. Deleting an untagged child
        # that a kept parent still needs would break that parent, so we record parent/child relationships
        # here to protect them together in "Reconcile manifest groups" below. If any digest can't be
        # inspected, its group is unknown, so "Throttle and Delete" only logs this run's deletions.
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # one line per known digest: {package, digest, children}, where children is null if the digest is not an index
          CACHE_FILE=.cache/manifest-groups/manifests.jsonl
          mkdir -p "$(dirname "$CACHE_FILE")"
          touch "$CACHE_FILE"
          NEW_FILE="$RUNNER_TEMP/manifests.new.jsonl"
          : > "$NEW_FILE"
          FAILED=0

          get_bearer() {
            local response
            response=$(curl -fsS -u "x:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:stjude/${pkg}:pull") || return 1
            echo "$response" | jq -er '.token // empty'
          }
          get_manifest() {
            curl -fsS -H "Authorization: Bearer $BEARER" -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json" "https://ghcr.io/v2/stjude/${pkg}/manifests/${digest}"
          }

          for pkg in $(echo "$INDEX_PACKAGES" | jq -r '.[]'); do
            BEARER=""
            while read -r digest; do
              if [ -z "$BEARER" ] && ! BEARER=$(get_bearer); then
                # skip only this digest, as before; the next digest tries for a new bearer
                echo "::warning::no valid bearer for $pkg@$digest - skipping"
                BEARER=""
                FAILED=$((FAILED + 1))
                continue
              fi
              if ! MANIFEST=$(get_manifest); then
                # the bearer may have expired during a long run; get a new one and retry once
                if ! { BEARER=$(get_bearer) && MANIFEST=$(get_manifest); }; then
                  echo "::warning::manifest fetch failed for $pkg@$digest - skipping"
                  BEARER=""
                  FAILED=$((FAILED + 1))
                  continue
                fi
              fi
              echo "$MANIFEST" | jq -c --arg pkg "$pkg" --arg digest "$digest" '{
                package: $pkg,
                digest: $digest,
                children: (if .mediaType == "application/vnd.oci.image.index.v1+json" then [.manifests[].digest] else null end)
              }' >> "$NEW_FILE"
            done < <(jq -r -n --arg pkg "$pkg" --slurpfile versions "$IMAGE_VERSIONS_FILE" --slurpfile cache "$CACHE_FILE" '
              ($cache | map({key: (.package + " " + .digest), value: true}) | from_entries) as $seen
              | $versions[0][] | select(.package == $pkg and ($seen[$pkg + " " + .name] | not)) | .name
            ')
          done
          echo "fetched $(wc -l < "$NEW_FILE") uncached manifests"
          if [ "$FAILED" -gt 0 ]; then
            # failed digests are not cached, so the next run retries only those
            echo "::warning::$FAILED manifests could not be inspected - image deletions in this run will only be logged"
            echo "DISCOVERY_INCOMPLETE=true" >> "$GITHUB_ENV"
          fi

          # drop digests that no longer exist, so the cache only holds current versions
          jq -c -n --slurpfile versions "$IMAGE_VERSIONS_FILE" --slurpfile known <(cat "$CACHE_FILE" "$NEW_FILE") '
            ($versions[0] | map({key: (.package + " " + .name), value: true}) | from_entries) as $current
            | $known[] | select($current[.package + " " + .digest])
          ' > "$RUNNER_TEMP/manifests.jsonl"
          mv "$RUNNER_TEMP/manifests.jsonl" "$CACHE_FILE"

          GROUPS_FILE="$RUNNER_TEMP/groups.json"
          jq -c 'select(.children != null) | {parent: .digest, children}' "$CACHE_FILE" > "$GROUPS_FILE"
          echo "GROUPS_FILE=$GROUPS_FILE" >> "$GITHUB_ENV"

      - name: Compute images to be retained
        run: |
          PROTECTED_IDS=$(jq -c --argjson n "$VERSIONS_TO_RETAIN" '[group_by(.package)[] | sort_by(.created_at) | reverse | .[0:$n] | .[].id]' "$IMAGE_VERSIONS_FILE")
          echo "PROTECTED_IDS=$PROTECTED_IDS" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{secrets.PAT}}

      - name: Filter Packages
        # One jq pass over all versions; starting several jq processes per version in a shell loop took minutes.
        # A version is kept if any of these is true:
        #   - it is one of the newest VERSIONS_TO_RETAIN of its package (PROTECTED_IDS)
        #   - a tag is "latest" or "protected", or starts with "paper-"
        #   - a version tag's major.minor prefix (e.g. 2.224 from v2.224.1) has an active release-<major.minor> branch
        #   - it is younger than MAX_AGE_DAYS
        # Untagged (digest-only) versions can only be kept by PROTECTED_IDS or age.
        run: |
          VERDICTS_FILE="$RUNNER_TEMP/verdicts.json"

          jq -c --argjson protected "$PROTECTED_IDS" --argjson branches "$RELEASE_BRANCHES" --argjson maxAge "$MAX_AGE_DAYS" '
            def on_release_branch: #true if any version tag has a matching release-<major.minor> branch
              any(
                .[] | capture("^v?(?<mm>[0-9]+\\.[0-9]+)\\.[0-9]+(-.+)?$") | "release-" + .mm;
                . as $p | any($branches[]; . == $p or startswith($p + ".") or startswith($p + "-"))
              );
            def age_days: (now - (.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) / 86400 | floor;

            .[]
            | (.tags // []) as $tags
            | (.id as $id | any($protected[]; . == $id)) as $isProtected
            | . + {keep: (
                $isProtected
                or any($tags[]; . == "latest" or . == "protected" or startswith("paper-"))
                or ($tags | on_release_branch)
                or age_days < $maxAge
              )}
          ' "$IMAGE_VERSIONS_FILE" > "$VERDICTS_FILE"

          # Every version's verdict is recorded here, not just the eligible ones - "Reconcile manifest
          # groups" needs to see KEPT versions too, to know when a whole parent/child group must be protected.
          echo "VERDICTS_FILE=$VERDICTS_FILE" >> "$GITHUB_ENV"

      - name: Reconcile manifest groups
        # If any member of a parent/child group (built above) is independently kept, protect every member
        # of that group - this stops us from deleting a referenced child under a kept parent, or deleting
        # a parent while leaving its children as newly-orphaned junk.
        run: |
          ELIGIBLE_FILE="$RUNNER_TEMP/eligible.json"

          PROTECTED_DIGESTS=$(jq -n --slurpfile verdicts "$VERDICTS_FILE" --slurpfile groups "$GROUPS_FILE" '
            ($verdicts | map(select(.keep) | .name)) as $kept_digests
            | [
                $groups[]
                | select(([.parent] + .children) | any(. as $d | $kept_digests | index($d) != null))
                | ([.parent] + .children)[]
              ]
          ')

          jq -c --argjson protected "$PROTECTED_DIGESTS" 'select((.keep | not) and ((.name as $n | $protected | index($n)) == null))' "$VERDICTS_FILE" > "$ELIGIBLE_FILE"

          echo "ELIGIBLE_FILE=$ELIGIBLE_FILE" >> "$GITHUB_ENV"

      - name: Throttle and Delete
        # Each eligible item is either standalone, or part of a parent/child group recorded in GROUPS_FILE.
        # A whole group counts as ONE slot against MAX_DELETIONS (not one slot per member), so the cap can
        # never select part of a group and leave the rest behind - that would break the surviving members.
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ "${DISCOVERY_INCOMPLETE:-}" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            # set by "Build manifest groups" when a digest could not be inspected
            echo "::warning::manifest groups are incomplete - only logging the deletions in this run"
            DRY_RUN=true
          fi

          BATCH=$(jq -c --slurpfile eligible "$ELIGIBLE_FILE" --slurpfile groups "$GROUPS_FILE" --argjson n "$MAX_DELETIONS" -n '
            ($eligible | map({(.name): .}) | add) as $by_digest #by_digest is a lookup table so we can fetch an eligible item full record by its digest
            | ($groups | map(.parent)) as $parent_digests #every digest that is a group parent
            | ($groups | map(.children[])) as $child_digests #$parent_digests/$child_digests are flat lists used to identify which eligible items are standalone
            | (
                [
                  $groups[] #one selection unit per group - only groups whose parent actually shows up in ELIGIBLE_FILE (reconciliation already guarantees the whole group is eligible together)
                  | select($by_digest[.parent] != null)
                  | {date: $by_digest[.parent].created_at, items: ([.parent] + .children | map($by_digest[.]))} #items = [parent, then children] in that order, so deletion below naturally does parent-first
                ]
                + #combine the group units with every standalone (ungrouped) eligible item, each as its own one-item unit
                [
                  $eligible[]
                  | select(.name as $n | ($parent_digests | index($n)) == null and ($child_digests | index($n)) == null) #keep only items that are neither a parent nor a child of any group
                  | {date: .created_at, items: [.]}
                ]
              )
            | sort_by(.date)[0:$n] #sort ALL units (groups and standalones alike) oldest first, and take only MAX_DELETIONS of them - a group here still only costs one slot
            | [.[].items[]] #flatten the selected units back into one flat list of items to actually delete
          ')

          while read -r item; do
            package=$(echo "$item" | jq -r '.package')
            id=$(echo "$item" | jq -r '.id')
            tags=$(echo "$item" | jq -c '.tags')
            created_at=$(echo "$item" | jq -r '.created_at')

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete: package=$package id=$id created_at=$created_at tags=$tags"
            else
              echo "deleting: package=$package id=$id created_at=$created_at tags=$tags"
              gh api --method DELETE "orgs/stjude/packages/container/${package}/versions/${id}"
            fi
          done < <(echo "$BATCH" | jq -c '.[]')

  cleanup-releases:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{secrets.PAT}}
          
      - name: Read Config     
        run: |
         CONFIG=.github/cleanup-config.json
         echo "MAX_AGE_DAYS=$(jq -r '.maxAgeDays' "$CONFIG")" >> "$GITHUB_ENV"
         echo "MAX_DELETIONS=$(jq -r '.maxReleaseDeletionsPerRun' "$CONFIG")" >> "$GITHUB_ENV"
         echo "RELEASES_TO_RETAIN=$(jq -r '.ReleasesToRetain' "$CONFIG")" >> "$GITHUB_ENV"

      - name: List release branches
        run: |
          BRANCH_PAGES=$(gh api repos/stjude/proteinpaint/branches --paginate)
          RELEASE_BRANCHES=$(printf '%s\n' "$BRANCH_PAGES" | jq -sc '[.[][] | .name | select(startswith("release-"))]')
          echo "RELEASE_BRANCHES=$RELEASE_BRANCHES" >> "$GITHUB_ENV" 
        env:
          GH_TOKEN: ${{secrets.PAT}}
 
      - name: List releases
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          RELEASES=$(gh api "repos/stjude/proteinpaint/releases" --paginate --jq '[.[] | select(.draft == false) | {tag: .tag_name, created_at: .published_at}]')
          RELEASES=$(printf '%s\n' "$RELEASES" | jq -sc 'add // []')
          echo "RELEASES=$RELEASES" >> "$GITHUB_ENV"

      - name: Compute releases to be retained
        run: |
          PROTECTED_IDS=$(echo "$RELEASES" | jq -c --argjson n "$RELEASES_TO_RETAIN" '[sort_by(.created_at) | reverse | .[0:$n] | .[].tag]')
          echo "PROTECTED_IDS=$PROTECTED_IDS" >> "$GITHUB_ENV"

      - name: Filter Releases
        # Same rules as "Filter Packages" in the cleanup-images job, in one jq pass. Only the releases
        # that are NOT kept are listed in ELIGIBLE.
        run: |
          ELIGIBLE=$(echo "$RELEASES" | jq -c --argjson protected "$PROTECTED_IDS" --argjson branches "$RELEASE_BRANCHES" --argjson maxAge "$MAX_AGE_DAYS" '
            def on_release_branch: #true if the version tag has a matching release-<major.minor> branch
              any(
                capture("^v(?<mm>[0-9]+\\.[0-9]+)\\.[0-9]+(-.+)?$") | "release-" + .mm;
                . as $p | any($branches[]; . == $p or startswith($p + ".") or startswith($p + "-"))
              );
            def age_days: (now - (.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) / 86400 | floor;

            [
              .[]
              | select((
                  (.tag == "latest" or .tag == "protected" or (.tag | startswith("paper-")))
                  or (.tag as $t | any($protected[]; . == $t))
                  or (.tag | on_release_branch)
                  or age_days < $maxAge
                ) | not)
            ]
          ')
          echo "ELIGIBLE=$ELIGIBLE" >> "$GITHUB_ENV"

      - name: Throttle and Delete
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          BATCH=$(echo "$ELIGIBLE" | jq -c "sort_by(.created_at)[0:$MAX_DELETIONS]")

          while read -r item; do
            tag=$(echo "$item" | jq -r '.tag')
            created_at=$(echo "$item" | jq -r '.created_at')

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete: tag=$tag created_at=$created_at"
            else
              echo "deleting: tag=$tag created_at=$created_at"
              gh release delete "$tag" --yes
            fi
          done < <(echo "$BATCH" | jq -c '.[]')




