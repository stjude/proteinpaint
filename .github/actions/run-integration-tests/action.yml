name: 'Run integration tests'
description: 'Runs integration tests inside Docker and posts results to Slack'

inputs:
  TOKEN:
    description: 'GitHub Token'
    required: true

  SLACK_WEBHOOK_URL:
    description: 'Slack webhook for posting test results'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v6
      with:
        cache: 'npm'
        node-version: '24'

    - name: Install PP packages
      shell: bash
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      run: |
        npm ci

    - name: Prepare for Docker build
      shell: bash
      run: |
        cd ./container
        ./pack.sh -s

    - name: Copy serverconfig.json to root
      shell: bash
      run: |
        cp container/ci/serverconfig.json container/

    - name: Create cache folder
      shell: bash
      run: mkdir cache

    - name: Install Google Chrome for Puppeteer
      shell: bash
      run: | # pragma: allowlist secret
        # Install Google Chrome so Puppeteer can use a system Chrome binary
        # pragma: allowlist secret
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable" >> $GITHUB_ENV

    - name: Login to Github
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.TOKEN }}

    # TEMPORARY: the "docker" driver shares the runner's local image store directly, so the locally-built
    # ppdepsruntime image below resolves without a registry pull. The default docker-container driver runs
    # BuildKit in an isolated container that cannot see it, and tries (and fails) to pull it from a registry
    # instead. Revert this along with the rest of the TEMPORARY changes once ppdepsruntime is published, so
    # this step goes back to the type=gha build cache.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker

    # TEMPORARY, for testing this branch before ppdepsruntime is published: build only the ppruntime target
    # locally instead of pulling ghcr.io/stjude/ppdepsruntime, which does not exist yet. deps/build.sh is not
    # used here since it also builds ppserver/ppfull from deps/Dockerfile, which install published app
    # packages that this branch does not need and may not exist yet. Revert once ppdepsruntime is published.
    - name: Build ppdepsruntime locally
      shell: bash
      run: |
        CTX=$(mktemp -d)
        mkdir -p "$CTX/R" "$CTX/python"
        cp container/deps/Dockerfile "$CTX/"
        cp -R R/utils "$CTX/R/"
        cp python/requirements.txt "$CTX/python/"
        cp container/deps/checkSharedLibs.sh "$CTX/"
        docker buildx build "$CTX" --file "$CTX/Dockerfile" --target ppruntime --tag ppdepsruntime:latest \
          --build-arg ARCH=x86_64 --build-arg OS_UPDATES="$(date -u +%Y-%m-%d)" --output type=docker

    - name: Build Docker Image
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
        BUILDX_METADATA_PROVENANCE: disabled
      with:
        context: ./container/
        file: ./container/server/Dockerfile
        tags: ppserver:latest
        # the tarballs may have the same path and version as the base image packages, but changed code
        # TEMPORARY: BASE_IMAGE, see the "Build ppdepsruntime locally" step above
        build-args: |
          REINSTALL_SJCRH=1
          BASE_IMAGE=ppdepsruntime:latest
        platforms: linux/amd64
        outputs: type=docker
        # TEMPORARY: the docker driver (see "Set up Docker Buildx" above) does not support the type=gha
        # cache backend, only the default docker-container driver does
        provenance: false
        sbom: false

    - name: Run local server and integration tests
      id: integration
      shell: bash
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      run: |
        set -e
        cd ./container
        ./run.sh ppserver:latest
        sleep 10
        cd ..
        # Run integration tests using headless Chrome (no X server / xvfb required)
        npm run test:integration
      continue-on-error: true

    - name: Check if integration tests passed
      id: check-tests
      shell: bash
      run: |
        # client/test/puppet.js emits the passedTests.txt file
        if [ -f ./client/passedTests.txt ]; then
          echo "INTEGRATION_TEST_PASSED=true" >> "$GITHUB_ENV"
        fi

    - name: Get current time
      id: current-time
      if: always()
      shell: bash
      run: |
        echo "formattedTime=$(TZ=America/Chicago date '+%b %d, %Y %H:%M:%S')" >> "$GITHUB_OUTPUT"

    - name: Set short git commit SHA
      id: vars
      if: always()
      shell: bash
      run: echo "SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

    - name: Post build results on Slack
      if: github.ref_name == 'master'
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ inputs.SLACK_WEBHOOK_URL }} #webhook URL is now an input (was the SLACK_WEBHOOK_URL env var) Composite actions can't access secrets — must receive it as an input
        webhook-type: webhook-trigger #our URL is a Slack Workflow Builder trigger (accepts custom keys)
        payload: |
          {
            "status": "${{ env.INTEGRATION_TEST_PASSED == 'true' && 'success' || 'failure' }} - https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ env.SHORT_SHA }}",
            "date-time": "${{ steps.current-time.outputs.formattedTime }}"
          }

    - name: Fail job if integration test failed
      if: env.INTEGRATION_TEST_PASSED != 'true'
      shell: bash
      run: exit 1
